<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Battle Royale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #e94560;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .menu-container {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1, h2 { text-align: center; color: #fff; }
        fieldset { border: 1px solid #0f3460; border-radius: 5px; margin-bottom: 15px; }
        legend { color: #e94560; font-weight: bold; }
        input, select, button {
            width: 100%; margin-top: 5px; margin-bottom: 15px; padding: 10px;
            box-sizing: border-box; background: #0f3460; color: white; border: none; border-radius: 4px;
        }
        button {
            background-color: #e94560; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        button:hover { background-color: #ff5773; }
        
        /* Game Container Styles */
        #game-container {
            display: none; /* Hidden until game starts */
            width: 800px;
            max-width: 100%;
            position: relative;
            background: #000;
        }
        canvas {
            width: 100%;
            height: 450px;
            display: block;
        }
        #fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: auto;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid white;
            padding: 5px 15px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui-container" class="menu-container">
        <h1>Web Battle Royale</h1>
        
        <form id="auth-form">
            <fieldset>
                <legend>Authentication</legend>
                <input type="text" id="username" placeholder="Username (Leave blank for Guest)">
                <input type="password" id="password" placeholder="Password">
                <button type="submit">Log In / Play as Guest</button>
            </fieldset>
        </form>

        <form id="locker-form">
            <fieldset>
                <legend>Locker</legend>
                <select id="skin-select">
                    <option value="default">Default Recruit</option>
                    <option value="knight">Black Knight</option>
                    <option value="astronaut">Dark Voyager</option>
                </select>
            </fieldset>
        </form>

        <form id="party-form">
            <fieldset>
                <legend>Party & Multiplayer</legend>
                <input type="text" id="invite-code" placeholder="Enter Party Code">
                <button type="button" onclick="alert('Searching for LAN matches...')">Scan LAN Network</button>
            </fieldset>
        </form>

        <form id="matchmaking-form">
            <fieldset>
                <legend>Matchmaking</legend>
                <label><input type="radio" name="mode" value="solo" checked> Solo</label><br><br>
                <label><input type="radio" name="mode" value="duo"> Duo</label><br><br>
                <button type="submit" style="font-size: 1.2em; padding: 15px;">READY UP</button>
            </fieldset>
        </form>
    </div>

    <div id="game-container">
        <button id="fullscreen-btn">Toggle Fullscreen</button>
        <canvas id="game-canvas" width="800" height="450"></canvas>
    </div>

    <script>
        // --- UI & Logic ---
        const uiContainer = document.getElementById('ui-container');
        const gameContainer = document.getElementById('game-container');
        const authForm = document.getElementById('auth-form');
        const matchmakingForm = document.getElementById('matchmaking-form');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        let currentUser = "Guest_" + Math.floor(Math.random() * 90000 + 10000);

        // Handle Login
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value;
            if (usernameInput) currentUser = usernameInput;
            alert(`Logged in as: ${currentUser}`);
        });

        // Handle Matchmaking & Transition to WebGL
        matchmakingForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const skin = document.getElementById('skin-select').value;
            const mode = document.querySelector('input[name="mode"]:checked').value;
            
            alert(`Starting ${mode} match as ${currentUser} using ${skin} skin! Loading assets...`);
            
            // Hide UI, Show Game
            uiContainer.style.display = 'none';
            gameContainer.style.display = 'block';
            
            // Initialize WebGL Game Loop
            initWebGL();
        });

        // Handle Fullscreen
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                gameContainer.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // --- WebGL Engine Foundation ---
        function initWebGL() {
            const canvas = document.getElementById('game-canvas');
            const gl = canvas.getContext('webgl');

            if (!gl) {
                alert('WebGL not supported in this browser!');
                return;
            }

            // Basic Vertex Shader (Handles 3D positioning)
            const vsSource = `
                attribute vec4 aVertexPosition;
                void main() {
                    gl_Position = aVertexPosition;
                }
            `;

            // Basic Fragment Shader (Handles coloring)
            const fsSource = `
                precision mediump float;
                uniform vec4 uColor;
                void main() {
                    gl_FragColor = uColor;
                }
            `;

            // Compile Shader Function
            function loadShader(gl, type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error('An error occurred compiling the shaders: ' + gl.getShaderInfoLog(shader));
                    gl.deleteShader(shader);
                    return null;
                }
                return shader;
            }

            const vertexShader = loadShader(gl, gl.VERTEX_SHADER, vsSource);
            const fragmentShader = loadShader(gl, gl.FRAGMENT_SHADER, fsSource);

            // Create Shader Program
            const shaderProgram = gl.createProgram();
            gl.attachShader(shaderProgram, vertexShader);
            gl.attachShader(shaderProgram, fragmentShader);
            gl.linkProgram(shaderProgram);
            gl.useProgram(shaderProgram);

            // Get locations
            const positionLocation = gl.getAttribLocation(shaderProgram, 'aVertexPosition');
            const colorLocation = gl.getUniformLocation(shaderProgram, 'uColor');

            // Create a basic ground plane (two triangles forming a rectangle at the bottom half)
            const positions = new Float32Array([
                -1.0, -1.0,  // Bottom left
                 1.0, -1.0,  // Bottom right
                -1.0,  0.0,  // Mid left
                 1.0,  0.0,  // Mid right
            ]);

            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

            // Game Loop Render Function
            function render() {
                // Resize canvas internal resolution to match display size (useful for fullscreen)
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);

                // Clear screen to a "Sky Blue" color
                gl.clearColor(0.5, 0.8, 1.0, 1.0); 
                gl.clear(gl.COLOR_BUFFER_BIT);

                // Draw Ground Plane (Green)
                gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
                gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(positionLocation);
                
                gl.uniform4f(colorLocation, 0.2, 0.8, 0.2, 1.0); // Green ground
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                // Request next frame
                requestAnimationFrame(render);
            }

            // Start the game loop
            requestAnimationFrame(render);
        }
    </script>
</body>
</html>
